<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>그레이스 내집마련 계산기</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --line: #e2e8f0;
            --ink: #0f172a;
            --muted: #64748b;
            --faint: #94a3b8;
            --safe-b: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--ink);
            overflow-x: hidden;
            line-height: 1.5;
            word-break: keep-all; /* 한글 어절 단위 줄바꿈 (단어 중간에서 안 끊김) */
        }

        /* ---------- Sticky top bar with primary inputs ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(255,255,255,0.92);
            backdrop-filter: saturate(180%) blur(12px);
            -webkit-backdrop-filter: saturate(180%) blur(12px);
            border-bottom: 1px solid var(--line);
            padding: 10px 14px calc(10px + env(safe-area-inset-top, 0px));
            padding-top: calc(10px + env(safe-area-inset-top, 0px));
        }
        .topbar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .topbar-title { font-size: 1rem; font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gear {
            flex: none; width: 40px; height: 40px; border-radius: 12px;
            border: 1px solid var(--line); background: #fff; color: var(--muted);
            font-size: 1.15rem; display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background .15s;
        }
        .gear:active { background: #f1f5f9; }

        .top-inputs { display: flex; gap: 8px; }
        .field { flex: 1; min-width: 0; }
        .field > span { display: block; font-size: 0.72rem; font-weight: 500; color: var(--muted); margin-bottom: 3px; }
        .inp { position: relative; display: flex; align-items: center; }
        .inp input {
            width: 100%; font-size: 16px; font-weight: 700; color: var(--ink);
            padding: 9px 38px 9px 11px; border: 1px solid #cbd5e1; border-radius: 11px;
            background: #fff; outline: none; transition: border-color .15s, box-shadow .15s;
            font-family: inherit;
        }
        .inp input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.18); }
        .inp em { position: absolute; right: 11px; font-style: normal; font-size: 0.78rem; color: var(--faint); pointer-events: none; }

        /* hide number spinners */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* ---------- Page wrapper ---------- */
        .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 14px calc(40px + var(--safe-b)); }
        .intro { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 4px 0 18px; }
        .intro b { color: var(--ink); }

        /* ---------- Comparison / ranking ---------- */
        .compare {
            background: var(--card); border-radius: 16px; padding: 16px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px -12px rgba(0,0,0,.18);
            margin-bottom: 20px;
        }
        .compare h2 { font-size: 0.95rem; font-weight: 800; margin: 0 0 4px; }
        .compare .sub { font-size: 0.74rem; color: var(--faint); margin: 0 0 14px; }
        .cmp-row { display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 10px; margin-bottom: 11px; }
        .cmp-row:last-child { margin-bottom: 0; }
        .cmp-name { font-size: 0.78rem; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cmp-name .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
        .cmp-track { height: 9px; background: #eef2f7; border-radius: 99px; overflow: hidden; }
        .cmp-fill { height: 100%; border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
        .cmp-val { font-size: 0.82rem; font-weight: 700; text-align: right; white-space: nowrap; }

        /* ---------- Result cards ---------- */
        .cards { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media (min-width: 720px) { .cards { grid-template-columns: 1fr 1fr; } }
        @media (min-width: 1040px) { .cards { grid-template-columns: 1fr 1fr 1fr; } }

        .card {
            background: var(--card); border-radius: 16px; overflow: hidden;
            border-top: 4px solid var(--accent, #94a3b8);
            box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 10px 28px -16px rgba(0,0,0,.25);
            display: flex; flex-direction: column;
        }
        .card.best { box-shadow: 0 0 0 2px var(--accent), 0 12px 30px -14px rgba(0,0,0,.3); }
        .card.dim { opacity: .72; }

        .card-head { padding: 16px 16px 12px; position: relative; }
        .badge {
            display: inline-flex; align-items: center; gap: 4px; font-size: 0.68rem; font-weight: 700;
            color: #fff; background: var(--accent); padding: 3px 9px; border-radius: 99px; margin-bottom: 8px;
        }
        .card-head h3 { font-size: 1.05rem; font-weight: 800; margin: 0; line-height: 1.35; }
        .card-head .sub { font-size: 0.78rem; color: var(--muted); margin: 4px 0 0; }

        .card-body { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
        .metric .label { font-size: 0.78rem; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .metric .big { font-size: 1.7rem; font-weight: 800; color: var(--accent); margin-top: 2px; letter-spacing: -.01em; }
        .metric .note { font-size: 0.72rem; color: var(--faint); margin-top: 3px; }

        .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 4px; border-top: 1px dashed var(--line); }
        .metric-grid .val { font-size: 1.15rem; font-weight: 700; color: var(--ink); margin-top: 2px; }

        .card-foot { background: #f8fafc; border-top: 1px solid var(--line); padding: 13px 16px; font-size: 0.76rem; display: flex; flex-direction: column; gap: 7px; }
        .card-foot p { margin: 0; }
        .tag { font-weight: 700; }
        .tag.pro { color: #16a34a; }
        .tag.con { color: #dc2626; }
        .tag.bonus { color: #2563eb; }

        .err-body { padding: 24px 16px; text-align: center; }
        .err-body .t { font-weight: 700; color: var(--muted); }
        .err-body .d { font-size: 0.8rem; color: var(--faint); margin-top: 8px; }

        /* info button */
        .info-btn {
            flex: none; width: 18px; height: 18px; border-radius: 50%; border: none;
            background: #cbd5e1; color: #fff; font-size: 0.66rem; font-weight: 700;
            font-style: italic; line-height: 1; cursor: pointer; padding: 0;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .info-btn:active { background: var(--faint); }

        footer { text-align: center; font-size: 0.7rem; color: var(--faint); margin-top: 28px; }

        /* ---------- Bottom sheet ---------- */
        .sheet-back {
            position: fixed; inset: 0; z-index: 60; background: rgba(15,23,42,.45);
            opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s;
        }
        .sheet-back.open { opacity: 1; visibility: visible; }
        .sheet {
            position: absolute; left: 0; right: 0; bottom: 0;
            background: #fff; border-radius: 20px 20px 0 0;
            max-height: 88vh; display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
            padding-bottom: var(--safe-b);
        }
        .sheet-back.open .sheet { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 4px; border-radius: 99px; background: #cbd5e1; margin: 10px auto 4px; flex: none; }
        .sheet-head { display: flex; align-items: center; gap: 10px; padding: 6px 18px 12px; border-bottom: 1px solid var(--line); flex: none; }
        .sheet-head h2 { font-size: 1rem; font-weight: 800; margin: 0; flex: 1; }
        .sheet-close { width: 32px; height: 32px; border-radius: 9px; border: none; background: #f1f5f9; color: var(--muted); font-size: 1rem; cursor: pointer; }
        .sheet-body { padding: 16px 18px 24px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .tip-text { font-size: 0.9rem; color: #334155; line-height: 1.65; }

        /* advanced settings groups */
        .grp { margin-bottom: 18px; }
        .grp:last-child { margin-bottom: 0; }
        .grp-title { font-size: 0.74rem; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 10px; }
        .grp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .glabel { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
        .gfield label { font-size: 0.76rem; color: var(--muted); font-weight: 500; }
        .gfield .info-btn { width: 16px; height: 16px; font-size: 0.6rem; }
        .gfield .inp input { font-size: 16px; font-weight: 600; padding: 9px 36px 9px 11px; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Sticky top bar: always-reachable primary inputs -->
    <div class="topbar">
        <div class="topbar-row">
            <div class="topbar-title">그레이스 내집마련 계산기 🐕</div>
            <button class="gear" id="openSettings" aria-label="고급 설정 열기">⚙️</button>
        </div>
        <div class="top-inputs">
            <label class="field">
                <span>나(그레이스)의 자기자본</span>
                <div class="inp"><input type="number" id="initialInvestment" inputmode="decimal" value="9000"><em>만원</em></div>
            </label>
            <label class="field">
                <span>내 연봉</span>
                <div class="inp"><input type="number" id="annualIncome" inputmode="decimal" value="5500"><em>만원</em></div>
            </label>
        </div>
    </div>

    <div class="wrap">
        <p class="intro">현 자산과 미래 전망을 바탕으로 <b>7가지 시나리오</b>를 비교해 줍니다.<br>숫자만 바꾸면 바로 다시 계산돼요.</p>

        <!-- 10-year net asset comparison -->
        <section class="compare" id="compare" hidden>
            <h2>📊 10년 후 순자산 비교</h2>
            <p class="sub">막대가 길수록 10년 뒤 남는 돈이 많아요.</p>
            <div id="compareBars"></div>
        </section>

        <!-- Result cards -->
        <div class="cards" id="outputContainer"></div>

        <footer>
            <p>ⓒ Seyong Oh · 입력 변수 기반 참고용 자료입니다.</p>
        </footer>
    </div>

    <!-- Advanced settings sheet -->
    <div class="sheet-back" id="settingsSheet">
        <div class="sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-head">
                <h2>고급 설정</h2>
                <button class="sheet-close" data-close>✕</button>
            </div>
            <div class="sheet-body">
                <div class="grp">
                    <p class="grp-title">집값 · 보증금</p>
                    <div class="grp-grid">
                        <div class="gfield"><div class="glabel"><label for="jeonseDeposit">전세 보증금</label><button type="button" class="info-btn" data-tip-text="시나리오 1(전세)에서 가정하는 전세 보증금이에요. 자기자본으로 부족한 부분은 전세자금대출(최대 2억)로 충당한다고 계산해요.">i</button></div><div class="inp"><input type="number" id="jeonseDeposit" inputmode="decimal" value="20000"><em>만원</em></div></div>
                        <div class="gfield"><div class="glabel"><label for="housePriceVilla">빌라/오피스텔 가격</label><button type="button" class="info-btn" data-tip-text="빌라·오피스텔 매수 시나리오(3·4·5번)에서 쓰는 매매가예요. 이 값으로 LTV 한도와 필요한 자기자본을 계산해요.">i</button></div><div class="inp"><input type="number" id="housePriceVilla" inputmode="decimal" value="30000"><em>만원</em></div></div>
                        <div class="gfield"><div class="glabel"><label for="banjeonseDeposit">반전세 보증금</label><button type="button" class="info-btn" data-tip-text="시나리오 2(반전세)의 보증금이에요. 전세보다 낮게 잡고 나머지는 월세로 냅니다. 보증금은 만기에 돌려받는 자산으로 계산해요.">i</button></div><div class="inp"><input type="number" id="banjeonseDeposit" inputmode="decimal" value="10000"><em>만원</em></div></div>
                        <div class="gfield"><div class="glabel"><label for="banjeonseMonthly">반전세 월세</label><button type="button" class="info-btn" data-tip-text="반전세에서 매달 내는 월세예요. 돌려받지 못하는 순수 비용이라 자산에 포함되지 않고, 월 저축액에서 차감돼요.">i</button></div><div class="inp"><input type="number" id="banjeonseMonthly" inputmode="decimal" value="50"><em>만원</em></div></div>
                        <div class="gfield"><div class="glabel"><label for="housePriceApt">아파트 가격</label><button type="button" class="info-btn" data-tip-text="아파트 매수 시나리오(6·7번)의 매매가예요. 디딤돌·생애최초·신혼부부 한도를 적용해 대출과 필요 자본을 계산해요.">i</button></div><div class="inp"><input type="number" id="housePriceApt" inputmode="decimal" value="45000"><em>만원</em></div></div>
                        <div class="gfield"><div class="glabel"><label for="loanTerm">대출 만기</label><button type="button" class="info-btn" data-tip-text="주택담보대출(원리금균등)의 상환 기간이에요. 길수록 매달 갚는 돈은 줄지만 총 이자는 늘어나요.">i</button></div><div class="inp"><input type="number" id="loanTerm" inputmode="decimal" value="30"><em>년</em></div></div>
                    </div>
                </div>
                <div class="grp">
                    <p class="grp-title">대출 금리</p>
                    <div class="grp-grid">
                        <div class="gfield"><div class="glabel"><label for="rateBank">시중은행</label><button type="button" class="info-btn" data-tip-text="일반 시중은행 주택담보대출 금리예요. 디딤돌 한도를 넘는 금액이나 생애최초가 적용되지 않을 때 이 금리가 쓰여요.">i</button></div><div class="inp"><input type="number" id="rateBank" inputmode="decimal" value="4.1" step="0.1"><em>%</em></div></div>
                        <div class="gfield"><div class="glabel"><label for="rateDidimdolSingle">디딤돌(단독)</label><button type="button" class="info-btn" data-tip-text="혼자(단독) 생애최초로 받는 디딤돌 대출 금리예요. 한도 2.4억까지 이 저금리가 적용돼요.">i</button></div><div class="inp"><input type="number" id="rateDidimdolSingle" inputmode="decimal" value="3.8" step="0.1"><em>%</em></div></div>
                        <div class="gfield"><div class="glabel"><label for="rateDidimdolMarried">디딤돌(신혼)</label><button type="button" class="info-btn" data-tip-text="신혼부부 디딤돌 대출 금리예요. 단독보다 금리가 낮고 한도도 3.2억으로 더 높아요.">i</button></div><div class="inp"><input type="number" id="rateDidimdolMarried" inputmode="decimal" value="3.1" step="0.1"><em>%</em></div></div>
                        <div class="gfield"><div class="glabel"><label for="rateRent">전세자금대출</label><button type="button" class="info-btn" data-tip-text="전세·반전세 보증금 대출에 적용되는 금리예요.">i</button></div><div class="inp"><input type="number" id="rateRent" inputmode="decimal" value="2.8" step="0.1"><em>%</em></div></div>
                        <div class="gfield"><div class="glabel"><label for="rateMinus">마이너스통장</label><button type="button" class="info-btn" data-tip-text="자기자본과 주택담보대출로도 부족할 때 메우는 신용대출 금리예요. 보통 가장 높아요.">i</button></div><div class="inp"><input type="number" id="rateMinus" inputmode="decimal" value="5.2" step="0.1"><em>%</em></div></div>
                    </div>
                </div>
                <div class="grp">
                    <p class="grp-title">상승률 · 수익률</p>
                    <div class="grp-grid">
                        <div class="gfield"><div class="glabel"><label for="appreciationVilla">빌라/오피스텔 연 상승률</label><button type="button" class="info-btn" data-tip-text="빌라 가격이 매년 오르는 비율이에요. 오피스텔은 이 값의 50%로 가정해 계산해요.">i</button></div><div class="inp"><input type="number" id="appreciationVilla" inputmode="decimal" value="1.5" step="0.1"><em>%</em></div></div>
                        <div class="gfield"><div class="glabel"><label for="appreciationApt">아파트 연 상승률</label><button type="button" class="info-btn" data-tip-text="아파트 가격이 매년 오르는 비율이에요. 보통 빌라보다 높게 잡아요.">i</button></div><div class="inp"><input type="number" id="appreciationApt" inputmode="decimal" value="5.0" step="0.1"><em>%</em></div></div>
                        <div class="gfield"><div class="glabel"><label for="investmentReturn">전세 시 투자수익률</label><button type="button" class="info-btn" data-tip-text="전세·반전세에서 집에 묶이지 않은 여유 자금을 굴렸을 때 기대하는 연 수익률이에요. 순자산 계산의 핵심 변수예요.">i</button></div><div class="inp"><input type="number" id="investmentReturn" inputmode="decimal" value="4.0" step="0.1"><em>%</em></div></div>
                    </div>
                </div>
                <div class="grp">
                    <p class="grp-title">배우자 (신혼부부용)</p>
                    <div class="grp-grid">
                        <div class="gfield"><div class="glabel"><label for="spouseInvestment">배우자 초기 자본</label><button type="button" class="info-btn" data-tip-text="시나리오 7(신혼)에서 배우자가 보태는 자기자본이에요. 내 자본과 합쳐 아파트 매수에 사용해요.">i</button></div><div class="inp"><input type="number" id="spouseInvestment" inputmode="decimal" value="5000"><em>만원</em></div></div>
                        <div class="gfield"><div class="glabel"><label for="spouseIncome">배우자 연봉</label><button type="button" class="info-btn" data-tip-text="시나리오 7(신혼)의 배우자 연봉이에요. 합산 소득으로 월 저축 여력을 계산해요.">i</button></div><div class="inp"><input type="number" id="spouseIncome" inputmode="decimal" value="5000"><em>만원</em></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tooltip / explanation sheet -->
    <div class="sheet-back" id="tipSheet">
        <div class="sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-head">
                <h2 id="tipTitle">설명</h2>
                <button class="sheet-close" data-close>✕</button>
            </div>
            <div class="sheet-body">
                <p class="tip-text" id="tipBody"></p>
            </div>
        </div>
    </div>

    <script>
    // --- Scenario Data ---
    const scenarios = [
        { id: 'rent',        title: '시나리오 1: 새 전세집 구하기',            short: '전세',           color: 'green',  type: 'rent' },
        { id: 'banjeonse',   title: '시나리오 2: 반전세 구하기',               short: '반전세',         color: 'teal',   type: 'banjeonse' },
        { id: 'buyNow',      title: '시나리오 3: 빌라/오피스텔 즉시 매수',     short: '빌라 즉시',      color: 'red',    type: 'buy', loan: 'bank', appreciation: 'villa' },
        { id: 'villa',       title: '시나리오 4: 빌라 매수 (디딤돌)',          short: '빌라(디딤돌)',   color: 'sky',    type: 'buy', loan: 'didimdol_single', appreciation: 'villa' },
        { id: 'officetel',   title: '시나리오 5: 오피스텔 매수 (디딤돌)',      short: '오피스텔',       color: 'orange', type: 'buy', loan: 'didimdol_single', appreciation: 'officetel' },
        { id: 'apt_single',  title: '시나리오 6: 아파트 매수 (혼자)',          short: '아파트(혼자)',   color: 'indigo', type: 'buy_apt_single' },
        { id: 'apt_married', title: '시나리오 7: 아파트 매수 (신혼)',          short: '아파트(신혼)',   color: 'purple', type: 'buy_apt_married' }
    ];
    const COLORS = { green:'#16a34a', teal:'#0d9488', red:'#dc2626', sky:'#0284c7', orange:'#ea580c', indigo:'#4f46e5', purple:'#9333ea' };
    const prosCons = {
        rent: { pros: '주택 소유에 따른 세금/유지보수 부담 없음.', cons: '내집 없는 설움, 자산 가치 상승 기회 상실. 저축으로만 돈 모음' },
        banjeonse: { pros: '전세 대비 보증금이 적어 목돈이 덜 묶이고, 남는 자본을 투자할 수 있음. 전세대출 이자 부담도 감소.', cons: '매달 내는 월세는 자산이 되지 않는 순수 지출. 집값 상승 기회도 없음.' },
        buyNow: { pros: '내 집이 주는 안정감. 주거 안정성 확보.', cons: '높은 시중은행 금리, 나중에 팔기 어려울 수 있음. 생애최초 상실' },
        villa: { pros: '저금리 디딤돌 대출 활용한 내 집 마련, 월세 대신 자산 축적.', cons: '아파트 대비 낮은 환금성 및 가치 상승률, 생애최초 소진.' },
        officetel: { pros: '편리한 관리, 우수한 보안 및 편의시설, 빌라대비 팔기 쉬움.', cons: '높은 관리비, 낮은 대지 지분으로 자산가치 상승 제한적' },
        apt_single: { pros: '가장 높은 자산 가치 상승 기대, 안정적인 우량 자산', cons: '돈 더 모아야 함, 월 상환 부담 매우 큼.' },
        apt_married: { pros: '강력한 신혼부부 혜택(높은 한도, 낮은 금리)으로 우량자산 매수', cons: '결혼 언제 할지 모름' }
    };

    // --- DOM Elements ---
    const inputs = {
        initialInvestment: document.getElementById('initialInvestment'),
        annualIncome: document.getElementById('annualIncome'),
        spouseInvestment: document.getElementById('spouseInvestment'),
        spouseIncome: document.getElementById('spouseIncome'),
        jeonseDeposit: document.getElementById('jeonseDeposit'),
        banjeonseDeposit: document.getElementById('banjeonseDeposit'),
        banjeonseMonthly: document.getElementById('banjeonseMonthly'),
        housePriceVilla: document.getElementById('housePriceVilla'),
        housePriceApt: document.getElementById('housePriceApt'),
        loanTerm: document.getElementById('loanTerm'),
        investmentReturn: document.getElementById('investmentReturn'),
        rateBank: document.getElementById('rateBank'),
        rateDidimdolSingle: document.getElementById('rateDidimdolSingle'),
        rateDidimdolMarried: document.getElementById('rateDidimdolMarried'),
        rateRent: document.getElementById('rateRent'),
        rateMinus: document.getElementById('rateMinus'),
        appreciationVilla: document.getElementById('appreciationVilla'),
        appreciationApt: document.getElementById('appreciationApt')
    };
    const outputContainer = document.getElementById('outputContainer');
    const compareSection = document.getElementById('compare');
    const compareBars = document.getElementById('compareBars');

    // --- Helper Functions ---
    const toEok = (num) => {
        if (isNaN(num) || !isFinite(num)) return '계산 불가';
        if (num >= 100000000) {
            return `${(num / 100000000).toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1')}억`;
        }
        return `${Math.round(num / 10000).toLocaleString()}만원`;
    };
    const toWonMonthly = (num) => isNaN(num) || !isFinite(num) ? '계산 불가' : `${Math.round(num).toLocaleString()} 원`;
    const parseVal = (el) => parseFloat(el.value) || 0;
    const parseRate = (el) => (parseFloat(el.value) || 0) / 100;
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function calculatePMT(rate, nper, pv) {
        if (pv <= 0 || rate <= 0 || nper <= 0) return 0;
        const monthlyRate = rate / 12;
        return (pv * monthlyRate) / (1 - Math.pow(1 + monthlyRate, -nper));
    }

    function calculateRemainingBalance(rate, nper, pmt, pv) {
        if (pv <= 0) return 0;
        const monthlyRate = rate / 12;
        return pv * Math.pow(1 + monthlyRate, nper) - pmt * (Math.pow(1 + monthlyRate, nper) - 1) / monthlyRate;
    }

    function getTakeHomePay(annualIncome) {
        // More accurate estimation
        if (annualIncome <= 50000000) return (annualIncome * 0.86) / 12;
        if (annualIncome <= 80000000) return (annualIncome * 0.84) / 12;
        return (annualIncome * 0.82) / 12;
    }

    // tooltip text registry (rebuilt every render)
    let tipStore = [];
    const tip = (text) => {
        const i = tipStore.length;
        tipStore.push(text);
        return `<button type="button" class="info-btn" data-tip="${i}" aria-label="자세히">i</button>`;
    };

    // --- Main Calculation Logic ---
    function calculateAndRender() {
        const MINUS_LOAN_LIMIT = 50000000;
        const initialInvestment = parseVal(inputs.initialInvestment) * 10000;
        const spouseInvestment = parseVal(inputs.spouseInvestment) * 10000;
        const annualIncome = parseVal(inputs.annualIncome) * 10000;
        const spouseIncome = parseVal(inputs.spouseIncome) * 10000;
        const takeHomePay = getTakeHomePay(annualIncome);
        const termYears = parseVal(inputs.loanTerm);
        const termMonths = termYears * 12;

        const vars = {
            jeonseDeposit: parseVal(inputs.jeonseDeposit) * 10000,
            banjeonseDeposit: parseVal(inputs.banjeonseDeposit) * 10000,
            banjeonseMonthly: parseVal(inputs.banjeonseMonthly) * 10000,
            housePriceVilla: parseVal(inputs.housePriceVilla) * 10000,
            housePriceApt: parseVal(inputs.housePriceApt) * 10000,
            rateBank: parseRate(inputs.rateBank),
            rateDidimdolSingle: parseRate(inputs.rateDidimdolSingle),
            rateDidimdolMarried: parseRate(inputs.rateDidimdolMarried),
            rateRent: parseRate(inputs.rateRent),
            rateMinus: parseRate(inputs.rateMinus),
            appreciationVilla: parseRate(inputs.appreciationVilla),
            appreciationOfficetel: parseRate(inputs.appreciationVilla) * 0.5,
            appreciationApt: parseRate(inputs.appreciationApt),
            investmentReturn: parseRate(inputs.investmentReturn)
        };

        tipStore = [];
        const scenarioData = {};
        const models = []; // one render-model per scenario

        scenarios.forEach(s => {
            const accent = COLORS[s.color];
            let monthlyPayment = 0;
            let monthlySavings = 0;
            let subtitleText = '';
            let netAsset5Tooltip = '';
            let netAsset10Tooltip = '';
            let results = {};
            let loanDetailsText = '';
            let appliedRateText = '';

            if (s.type === 'rent') {
                const rentDeposit = vars.jeonseDeposit;
                subtitleText = `전세금 ${toEok(rentDeposit)} 기준`;

                const maxRentLoan = 200000000;
                const minRequiredCapital = rentDeposit - maxRentLoan;
                let minusLoanAmount = 0;
                let rentLoan = 0;

                if (initialInvestment < minRequiredCapital) {
                    const shortfall = minRequiredCapital - initialInvestment;
                    if (shortfall > MINUS_LOAN_LIMIT) {
                        models.push({ id: s.id, title: s.title, accent, valid: false, subtitleText,
                            errMsg: `전세대출 최대 한도(${toEok(maxRentLoan)})를 받아도<br>최소 ${toEok(minRequiredCapital - MINUS_LOAN_LIMIT)}의<br>추가 자본이 필요합니다.` });
                        return;
                    }
                    minusLoanAmount = shortfall;
                    rentLoan = maxRentLoan;
                } else {
                    rentLoan = rentDeposit - initialInvestment;
                }

                loanDetailsText = `전세대출 ${toEok(rentLoan)}` + (minusLoanAmount > 0 ? ` + 신용 ${toEok(minusLoanAmount)}` : '');
                monthlyPayment = (rentLoan * vars.rateRent / 12) + (minusLoanAmount * vars.rateMinus / 12);
                monthlySavings = takeHomePay - monthlyPayment;
                appliedRateText = `${(vars.rateRent * 100).toFixed(1)}%`;
                if (minusLoanAmount > 0) appliedRateText += ` + 신용 ${(vars.rateMinus * 100).toFixed(1)}%`;

                const targetSavings = takeHomePay * 0.40;
                const savingsPerMonth = targetSavings - monthlyPayment;

                const calcNetAsset = (years) => {
                    if (savingsPerMonth <= 0) return initialInvestment - minusLoanAmount;
                    let fv_of_savings = savingsPerMonth * 12 * ((Math.pow(1 + vars.investmentReturn, years) - 1) / vars.investmentReturn);
                    return fv_of_savings + initialInvestment - minusLoanAmount;
                };
                results = { netAsset5: calcNetAsset(5), netAsset10: calcNetAsset(10) };
                netAsset5Tooltip = `초기 투자금(${toEok(initialInvestment)})과 월 저축액(${toWonMonthly(savingsPerMonth)} = 실수령액 40% - 이자)을 연 ${(vars.investmentReturn * 100).toFixed(1)}% 수익률로 복리 계산한 결과임. (전세대출 최대 한도 2억 가정)`;
                netAsset10Tooltip = netAsset5Tooltip;

            } else if (s.type === 'banjeonse') {
                const deposit = vars.banjeonseDeposit;
                const monthlyRent = vars.banjeonseMonthly;
                subtitleText = `보증금 ${toEok(deposit)} + 월세 ${toWonMonthly(monthlyRent)}`;

                const maxRentLoan = 200000000;
                let depositLoan = 0, minusLoanAmount = 0, investedCapital = 0;

                if (initialInvestment >= deposit) {
                    // 보증금을 자기자본으로 충당하고 남는 돈은 투자
                    investedCapital = initialInvestment - deposit;
                } else {
                    const needed = deposit - initialInvestment;
                    if (needed <= maxRentLoan) {
                        depositLoan = needed;
                    } else {
                        depositLoan = maxRentLoan;
                        const shortfall = needed - maxRentLoan;
                        if (shortfall > MINUS_LOAN_LIMIT) {
                            models.push({ id: s.id, title: s.title, accent, valid: false, subtitleText,
                                errMsg: `보증금대출 최대 한도(${toEok(maxRentLoan)})를 받아도<br>최소 ${toEok(deposit - maxRentLoan - MINUS_LOAN_LIMIT)}의<br>추가 자본이 필요합니다.` });
                            return;
                        }
                        minusLoanAmount = shortfall;
                    }
                }

                loanDetailsText = depositLoan > 0 ? `보증금대출 ${toEok(depositLoan)}` : '보증금대출 없음';
                if (minusLoanAmount > 0) loanDetailsText += ` + 신용 ${toEok(minusLoanAmount)}`;
                if (investedCapital > 0) loanDetailsText += ` · 여유자금 ${toEok(investedCapital)} 투자`;

                monthlyPayment = (depositLoan * vars.rateRent / 12) + (minusLoanAmount * vars.rateMinus / 12) + monthlyRent;
                monthlySavings = takeHomePay - monthlyPayment;

                appliedRateText = `월세 ${toWonMonthly(monthlyRent)}`;
                if (depositLoan > 0) appliedRateText = `보증금대출 ${(vars.rateRent * 100).toFixed(1)}% + ` + appliedRateText;
                if (minusLoanAmount > 0) appliedRateText += ` + 신용 ${(vars.rateMinus * 100).toFixed(1)}%`;

                const targetSavings = takeHomePay * 0.40;
                const savingsPerMonth = targetSavings - monthlyPayment;

                const calcNetAsset = (years) => {
                    let savingsFV = 0;
                    if (savingsPerMonth > 0) savingsFV = savingsPerMonth * 12 * ((Math.pow(1 + vars.investmentReturn, years) - 1) / vars.investmentReturn);
                    const leftoverFV = investedCapital * (Math.pow(1 + vars.investmentReturn, years) - 1);
                    return initialInvestment - minusLoanAmount + leftoverFV + savingsFV;
                };
                results = { netAsset5: calcNetAsset(5), netAsset10: calcNetAsset(10) };
                netAsset5Tooltip = `보증금(${toEok(deposit)})은 만기 시 돌려받는 자산으로 보고, 초기 투자금 중 여유자금(${toEok(investedCapital)})과 월 저축액(${toWonMonthly(savingsPerMonth)} = 실수령액 40% - 주거비용)을 연 ${(vars.investmentReturn * 100).toFixed(1)}% 수익률로 복리 계산한 결과임. 월세 ${toWonMonthly(monthlyRent)}는 자산이 되지 않는 비용으로 차감됨.`;
                netAsset10Tooltip = netAsset5Tooltip;

            } else if (s.type.startsWith('buy')) {
                const generateTooltip = (years, p, apr, lr, pmt, mla, mla_principal, benefitText) => {
                    const fv = p * Math.pow(1 + apr, years);
                    const rem = calculateRemainingBalance(lr, years * 12, pmt, mla);
                    return `${years}년 후 예상 집값 (${toEok(fv)}) - 대출잔액 (${toEok(rem + mla_principal)}) 임. ${benefitText}`;
                };

                const generateMixedTooltip = (years, p, apr, lr1, pmt1, la1, lr2, pmt2, la2, mla_principal, benefitText) => {
                    const fv = p * Math.pow(1 + apr, years);
                    const rem1 = calculateRemainingBalance(lr1, years * 12, pmt1, la1);
                    const rem2 = calculateRemainingBalance(lr2, years * 12, pmt2, la2);
                    return `${years}년 후 예상 집값 (${toEok(fv)}) - 총 대출잔액 (${toEok(rem1 + rem2 + mla_principal)}) 임. ${benefitText}`;
                };

                let price, appreciationRate, loanRate, mortgageLoanAmount, minusLoanAmount = 0;
                let benefitText = '';
                let currentInvestment = (s.id === 'apt_married') ? initialInvestment + spouseInvestment : initialInvestment;

                if (s.type === 'buy_apt_single' || s.type === 'buy_apt_married') {
                    price = vars.housePriceApt;
                    subtitleText = `아파트 ${toEok(price)} 매매 기준`;
                    appreciationRate = vars.appreciationApt;
                } else {
                    price = vars.housePriceVilla;
                    subtitleText = `빌라/오피스텔 ${toEok(price)} 매매 기준`;
                    appreciationRate = (s.id === 'officetel') ? vars.appreciationOfficetel : vars.appreciationVilla;
                }

                const ltv = (s.loan === 'bank') ? 0.7 : 0.8;
                let didimdolLimit = Infinity;
                if (s.type === 'buy_apt_married') didimdolLimit = 320000000;
                else if (s.type === 'buy_apt_single') didimdolLimit = 240000000;
                else if (s.loan === 'didimdol_single') didimdolLimit = 240000000;

                const maxLoanByLTV = price * ltv;
                const maxPossibleLoan = Math.min(maxLoanByLTV, (s.type === 'buy_apt_single') ? maxLoanByLTV : didimdolLimit);
                const minRequiredCapital = price - maxPossibleLoan;

                if (currentInvestment < minRequiredCapital) {
                    const shortfall = minRequiredCapital - currentInvestment;
                    if (shortfall > MINUS_LOAN_LIMIT) {
                        models.push({ id: s.id, title: s.title, accent, valid: false, subtitleText,
                            errMsg: `이 시나리오를 위해서는<br>최소 ${toEok(minRequiredCapital - MINUS_LOAN_LIMIT)}의<br>초기 자본이 필요합니다.` });
                        return;
                    }
                    minusLoanAmount = shortfall;
                    mortgageLoanAmount = maxPossibleLoan;
                } else {
                    mortgageLoanAmount = price - currentInvestment;
                }

                const minusLoanInterestPayment = minusLoanAmount * vars.rateMinus / 12;

                if (s.type === 'buy_apt_single') {
                    const didimdolLoan = Math.min(mortgageLoanAmount, didimdolLimit);
                    const bankLoan = mortgageLoanAmount - didimdolLoan;
                    loanDetailsText = `디딤돌 ${toEok(didimdolLoan)} + 은행 ${toEok(bankLoan)}`;
                    if (minusLoanAmount > 0) loanDetailsText += ` + 신용 ${toEok(minusLoanAmount)}`;

                    const didimdolPayment = calculatePMT(vars.rateDidimdolSingle, termMonths, didimdolLoan);
                    const bankPayment = calculatePMT(vars.rateBank, termMonths, bankLoan);
                    monthlyPayment = didimdolPayment + bankPayment + minusLoanInterestPayment;

                    appliedRateText = `디딤돌(단독) ${(vars.rateDidimdolSingle * 100).toFixed(1)}% + 은행 ${(vars.rateBank * 100).toFixed(1)}%`;
                    if (minusLoanAmount > 0) appliedRateText += ` + 신용 ${(vars.rateMinus * 100).toFixed(1)}%`;

                    monthlySavings = takeHomePay - monthlyPayment;

                    const calcNetAsset = (years) => price * Math.pow(1 + appreciationRate, years) - calculateRemainingBalance(vars.rateDidimdolSingle, years*12, didimdolPayment, didimdolLoan) - calculateRemainingBalance(vars.rateBank, years*12, bankPayment, bankLoan) - minusLoanAmount;
                    results = { netAsset5: calcNetAsset(5), netAsset10: calcNetAsset(10) };
                    benefitText = `생애최초 혜택(LTV 70%, 한도 2.4억)이 적용됨. (25년 6월 정책 개편으로 LTV/한도 축소)`;
                    netAsset5Tooltip = generateMixedTooltip(5, price, appreciationRate, vars.rateDidimdolSingle, didimdolPayment, didimdolLoan, vars.rateBank, bankPayment, bankLoan, minusLoanAmount, benefitText);
                    netAsset10Tooltip = generateMixedTooltip(10, price, appreciationRate, vars.rateDidimdolSingle, didimdolPayment, didimdolLoan, vars.rateBank, bankPayment, bankLoan, minusLoanAmount, benefitText);

                } else {
                    if (s.type === 'buy_apt_married') {
                        loanRate = vars.rateDidimdolMarried;
                        benefitText = `생애최초 신혼부부 혜택(LTV 70%, 한도 3.2억)이 적용됨. (25년 6월 정책 개편으로 LTV/한도 축소)`;
                        appliedRateText = `디딤돌(신혼) ${(loanRate * 100).toFixed(1)}%`;
                        loanDetailsText = `부부자본 ${toEok(currentInvestment)} + 디딤돌(신혼) ${toEok(mortgageLoanAmount)}`;
                    } else {
                        loanRate = (s.loan === 'didimdol_single') ? vars.rateDidimdolSingle : vars.rateBank;
                        benefitText = (s.loan === 'bank') ? `시중은행 대출은 스트레스 DSR 3단계 적용으로 한도가 축소(LTV 70% 적용)되었습니다.` : `생애최초 혜택(LTV 70%, 한도 2.4억)이 적용됨. (25년 6월 정책 개편으로 LTV/한도 축소)`;
                        appliedRateText = `${(loanRate * 100).toFixed(1)}%`;
                        loanDetailsText = `주담대 ${toEok(mortgageLoanAmount)}`;
                    }

                    if (minusLoanAmount > 0) loanDetailsText += ` + 신용 ${toEok(minusLoanAmount)}`;
                    if (minusLoanAmount > 0) appliedRateText += ` + 신용 ${(vars.rateMinus * 100).toFixed(1)}%`;

                    const mortgagePayment = calculatePMT(loanRate, termMonths, mortgageLoanAmount);
                    monthlyPayment = mortgagePayment + minusLoanInterestPayment;

                    if (s.type === 'buy_apt_married') {
                        const combinedTakeHomePay = getTakeHomePay(annualIncome + spouseIncome);
                        monthlySavings = combinedTakeHomePay - monthlyPayment;
                    } else {
                        monthlySavings = takeHomePay - monthlyPayment;
                    }

                    const calcNetAsset = (years) => price * Math.pow(1 + appreciationRate, years) - calculateRemainingBalance(loanRate, years * 12, mortgagePayment, mortgageLoanAmount) - minusLoanAmount;
                    results = { netAsset5: calcNetAsset(5), netAsset10: calcNetAsset(10) };
                    netAsset5Tooltip = generateTooltip(5, price, appreciationRate, loanRate, mortgagePayment, mortgageLoanAmount, minusLoanAmount, benefitText);
                    netAsset10Tooltip = generateTooltip(10, price, appreciationRate, loanRate, mortgagePayment, mortgageLoanAmount, minusLoanAmount, benefitText);
                    if (s.id === 'officetel') {
                        const officetelNote = ' (※ 오피스텔 상승률은 빌라의 50%로 가정)';
                        netAsset5Tooltip += officetelNote;
                        netAsset10Tooltip += officetelNote;
                    }
                }
            }

            const currentTakeHomePay = (s.id === 'apt_married') ? getTakeHomePay(annualIncome + spouseIncome) : takeHomePay;
            const monthlySavingsTooltip = `실수령액(${toWonMonthly(currentTakeHomePay)}) - 주거비용(${toWonMonthly(monthlyPayment)})`;

            scenarioData[s.id] = { monthlyPayment, ...results, totalPayment10yr: monthlyPayment * 120 };

            let footerAddon = '';
            if (s.id === 'apt_married' && scenarioData['apt_single']) {
                const interestSavings = scenarioData['apt_single'].totalPayment10yr - scenarioData['apt_married'].totalPayment10yr;
                const netAssetDifference = scenarioData['apt_married'].netAsset10 - scenarioData['apt_single'].netAsset10;
                const totalAdvantage = interestSavings + netAssetDifference;
                if (totalAdvantage > 0) {
                    const savingsTooltip = `단독 매수 대비 10년간 절약한 총 이자(${toEok(interestSavings)})와 늘어난 순자산(${toEok(netAssetDifference)})을 합산한 총 재무적 이득입니다.`;
                    footerAddon = { label: '단독 매수 대비 10년 총 이득', value: toEok(totalAdvantage), tip: savingsTooltip };
                }
            }

            models.push({
                id: s.id, title: s.title, short: s.short, accent, valid: true,
                subtitleText,
                paymentLabel: s.type === 'rent' ? '월 주거 비용 (이자)' : (s.type === 'banjeonse' ? '월 주거 비용 (이자+월세)' : '월 상환액 (원리금)'),
                monthlyPayment, monthlySavings, monthlySavingsTooltip,
                loanDetailsText, appliedRateText,
                netAsset5: results.netAsset5, netAsset10: results.netAsset10,
                netAsset5Tooltip, netAsset10Tooltip,
                footerAddon
            });
        });

        // --- Ranking by 10-year net asset (valid scenarios only) ---
        const valid = models.filter(m => m.valid);
        const ranked = [...valid].sort((a, b) => b.netAsset10 - a.netAsset10);
        const bestId = ranked.length ? ranked[0].id : null;

        renderCompare(ranked);
        outputContainer.innerHTML = models.map(m => m.valid ? cardHTML(m, m.id === bestId) : errCardHTML(m)).join('');
        window.__tips = tipStore;
    }

    function renderCompare(ranked) {
        if (!ranked.length) { compareSection.hidden = true; return; }
        const max = Math.max(...ranked.map(r => r.netAsset10), 1);
        compareBars.innerHTML = ranked.map((r, i) => {
            const pct = Math.max(0, r.netAsset10) / max * 100;
            return `<div class="cmp-row">
                <div class="cmp-name"><span class="dot" style="background:${r.accent}"></span>${esc(r.short)}${i === 0 ? ' 🏆' : ''}</div>
                <div class="cmp-track"><div class="cmp-fill" style="width:${pct}%;background:${r.accent}"></div></div>
                <div class="cmp-val">${toEok(r.netAsset10)}</div>
            </div>`;
        }).join('');
        compareSection.hidden = false;
    }

    function cardHTML(m, isBest) {
        const pros = prosCons[m.id].pros;
        const cons = prosCons[m.id].cons;
        const addon = m.footerAddon
            ? `<p><span class="tag bonus">${m.footerAddon.label}:</span> ${m.footerAddon.value} ${tip(m.footerAddon.tip)}</p>`
            : '';
        const badge = isBest ? `<span class="badge">🏆 10년 후 순자산 1위</span>` : '';
        return `
        <div class="card${isBest ? ' best' : ''}" style="--accent:${m.accent}">
            <div class="card-head">
                ${badge}
                <h3>${esc(m.title)}</h3>
                <p class="sub">${m.subtitleText}</p>
            </div>
            <div class="card-body">
                <div class="metric">
                    <div class="label">${m.paymentLabel}</div>
                    <div class="big">${toWonMonthly(m.monthlyPayment)}</div>
                    <div class="note">대출구성: ${m.loanDetailsText}</div>
                    <div class="note">적용금리: ${m.appliedRateText}</div>
                </div>
                <div class="metric">
                    <div class="label">주거비용 차감 후 월급 ${tip(m.monthlySavingsTooltip)}</div>
                    <div class="big">${toWonMonthly(m.monthlySavings)}</div>
                </div>
                <div class="metric-grid">
                    <div>
                        <div class="label">5년 후 순자산 ${tip(m.netAsset5Tooltip)}</div>
                        <div class="val">${toEok(m.netAsset5)}</div>
                    </div>
                    <div>
                        <div class="label">10년 후 순자산 ${tip(m.netAsset10Tooltip)}</div>
                        <div class="val">${toEok(m.netAsset10)}</div>
                    </div>
                </div>
            </div>
            <div class="card-foot">
                <p><span class="tag pro">장점:</span> ${pros}</p>
                <p><span class="tag con">단점:</span> ${cons}</p>
                ${addon}
            </div>
        </div>`;
    }

    function errCardHTML(m) {
        const pros = prosCons[m.id].pros;
        const cons = prosCons[m.id].cons;
        return `
        <div class="card dim" style="--accent:#94a3b8">
            <div class="card-head">
                <h3>${esc(m.title)}</h3>
                <p class="sub">${m.subtitleText}</p>
            </div>
            <div class="err-body">
                <p class="t">초기 투자금 부족</p>
                <p class="d">${m.errMsg}</p>
            </div>
            <div class="card-foot">
                <p><span class="tag pro">장점:</span> ${pros}</p>
                <p><span class="tag con">단점:</span> ${cons}</p>
            </div>
        </div>`;
    }

    // --- Bottom sheet controls ---
    const settingsSheet = document.getElementById('settingsSheet');
    const tipSheet = document.getElementById('tipSheet');
    const tipBody = document.getElementById('tipBody');

    function openSheet(el) { el.classList.add('open'); document.documentElement.style.overflow = 'hidden'; }
    function closeSheet(el) {
        el.classList.remove('open');
        // 다른 시트(예: 설정 위에 뜬 설명 시트)가 아직 열려 있으면 스크롤 잠금 유지
        if (!document.querySelector('.sheet-back.open')) document.documentElement.style.overflow = '';
    }

    document.getElementById('openSettings').addEventListener('click', () => openSheet(settingsSheet));
    document.querySelectorAll('.sheet-back').forEach(back => {
        back.addEventListener('click', (e) => {
            if (e.target === back || e.target.hasAttribute('data-close')) closeSheet(back);
        });
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeSheet(settingsSheet); closeSheet(tipSheet); }
    });

    // tooltip taps -> bottom sheet
    outputContainer.addEventListener('click', handleTip);
    compareBars.addEventListener('click', handleTip);
    function handleTip(e) {
        const btn = e.target.closest('.info-btn');
        if (!btn) return;
        const idx = parseInt(btn.getAttribute('data-tip'), 10);
        tipBody.textContent = (window.__tips && window.__tips[idx]) || '';
        openSheet(tipSheet);
    }

    // 고급 설정 항목별 설명: 정적 data-tip-text -> 설명 시트 (설정 시트 위에 표시)
    settingsSheet.addEventListener('click', (e) => {
        const btn = e.target.closest('.info-btn');
        if (!btn || !btn.hasAttribute('data-tip-text')) return;
        tipBody.textContent = btn.getAttribute('data-tip-text');
        openSheet(tipSheet);
    });

    // --- Event Listeners ---
    Object.values(inputs).forEach(el => el.addEventListener('input', calculateAndRender));
    window.addEventListener('load', calculateAndRender);
    calculateAndRender();
    </script>
</body>
</html>
